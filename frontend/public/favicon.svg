<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="nuzio-grad-1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="nuzio-grad-cyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="nuzio-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Dark Rounded Square -->
  <rect width="64" height="64" rx="16" fill="#09090b" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />
  
  <!-- Ambient glow in the center -->
  <circle cx="32" cy="32" r="18" fill="url(#nuzio-grad-1)" opacity="0.25" filter="url(#nuzio-glow)" />
  
  <!-- Audio Soundwave AI Bars -->
  <g filter="url(#nuzio-glow)">
    <!-- Bar 1 -->
    <rect x="14" y="26" width="4.5" height="12" rx="2.25" fill="url(#nuzio-grad-1)" />
    <!-- Bar 2 -->
    <rect x="22" y="18" width="4.5" height="28" rx="2.25" fill="url(#nuzio-grad-1)" />
    <!-- Bar 3 (Center Tallest) -->
    <rect x="30" y="12" width="4.5" height="40" rx="2.25" fill="url(#nuzio-grad-cyan)" />
    <!-- Bar 4 -->
    <rect x="38" y="20" width="4.5" height="24" rx="2.25" fill="url(#nuzio-grad-1)" />
    <!-- Bar 5 -->
    <rect x="46" y="27" width="4.5" height="10" rx="2.25" fill="url(#nuzio-grad-1)" />
  </g>
  
  <!-- Sparkle Accent -->
  <path d="M49 11L50.2 14.8L54 16L50.2 17.2L49 21L47.8 17.2L44 16L47.8 14.8L49 11Z" fill="#c084fc" opacity="0.9" />
</svg>